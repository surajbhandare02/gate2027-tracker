  <style>
    /* CSS Variables Design Tokens */
    :root {
      --background: #090d16;
      --content: #0f172a;
      --card: #131d33;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --border: #23314f;
      --primary: #3b82f6;
      --primary-foreground: #ffffff;
      --accent: #6366f1;
    }

    /* Base styles & Scrollbar */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 9999px;
    }

    /* Spring animation for habit checkbox */
    @keyframes springCheck {
      0% { transform: scale(1); }
      40% { transform: scale(1.3); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .spring-check {
      animation: springCheck 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Progress ring */
    .ring-progress {
      transition: stroke-dashoffset 0.6s ease;
    }

    /* Smooth tab transitions */
    .tab-content {
      animation: tabFadeIn 0.22s ease-out;
    }
    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modal Animation */
    @keyframes modalSlideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-sheet-animate {
      animation: modalSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Toast Animation */
    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-anim {
      animation: toastSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Timer digits */
    .timer-display {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>

    // Navigation Structure
    const NAV_TABS = [
      { id: 'home',     label: 'Home',     icon: 'home' },
      { id: 'syllabus', label: 'Syllabus', icon: 'syllabus' },
      { id: 'focus',    label: 'Focus',    icon: 'focus' },
      { id: 'settings', label: 'Settings', icon: 'settings' }
    ];

    // Global Application State (Starts strictly empty)
    let appState = {
      habits: [],          // array of habit objects
      habitLogs: {},       // { "YYYY-MM-DD": { habitId: value } }
      subjects: [],        // array of subject objects
      mockTests: [],       // array of mock test log entries
      settings: {
        examDate: "2027-02-06",
        targetScore: null,
        targetRank: null
      }
    };

    // Global Timer State (Persistent across tab switches)
    let timerState = {
      mode: 'pomodoro',        // 'pomodoro' | 'cbt'
      pomodoroType: 'focus',   // 'focus' | 'break'
      focusMins: 50,
      breakMins: 10,
      remainingSeconds: 50 * 60,
      isRunning: false
    };

    let timerInterval = null;
    let currentTab = 'home';
    let expandedSubjects = new Set(); // tracks open subject accordion cards

    /* ==========================================================================
       UTILITY & HELPER FUNCTIONS
       ========================================================================== */

    function generateId() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return 'id_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
    }

    function formatDateYMD(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getToday() {
      return formatDateYMD(new Date());
    }

    function formatDateNice(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function daysUntilGate() {
      const targetStr = (appState.settings && appState.settings.examDate) || '2027-02-06';
      const target = new Date(targetStr + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffTime = target - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return Math.max(0, diffDays);
    }

    function formatTimer(totalSeconds, mode = 'pomodoro') {
      const s = Math.max(0, totalSeconds);
      if (mode === 'cbt' || s >= 3600) {
        const hrs = Math.floor(s / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const secs = s % 60;
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      } else {
        const mins = Math.floor(s / 60);
        const secs = s % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
    }

    // Audio Chimes using Web Audio API (Zero external assets needed)
    function playAudioTone(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'check') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.12); // G5
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            const start = ctx.currentTime + idx * 0.08;
            gain.gain.setValueAtTime(0.15, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.28);
          });
        }
      } catch (err) {
        // Safe fallback if user has not yet interacted with audio element
      }
    }

    // Toast Notification System
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'toast-anim px-4 py-2.5 rounded-xl border shadow-xl text-xs font-semibold flex items-center justify-between pointer-events-auto backdrop-blur-md transition-all duration-200';
      
      if (type === 'success') {
        toast.style.borderColor = 'rgba(34, 197, 94, 0.45)';
        toast.style.backgroundColor = 'var(--card)';
        toast.style.color = '#4ade80';
      } else if (type === 'warning') {
        toast.style.borderColor = 'rgba(239, 68, 68, 0.45)';
        toast.style.backgroundColor = 'var(--card)';
        toast.style.color = '#f87171';
      } else {
        toast.style.borderColor = 'var(--border)';
        toast.style.backgroundColor = 'var(--card)';
        toast.style.color = 'var(--foreground)';
      }

      toast.innerHTML = `
        <span class="flex-1 mr-2 leading-tight">${message}</span>
        <button onclick="this.parentElement.remove()" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)] text-sm font-bold">&times;</button>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 250);
      }, 2600);
    }

    /* ==========================================================================
       LOCALSTORAGE PERSISTENCE
       ========================================================================== */

    const STORAGE_KEY = 'gate2027_tracker_state';

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState = {
            habits: Array.isArray(parsed.habits) ? parsed.habits : [],
            habitLogs: typeof parsed.habitLogs === 'object' && parsed.habitLogs !== null ? parsed.habitLogs : {},
            subjects: Array.isArray(parsed.subjects) ? parsed.subjects : [],
            mockTests: Array.isArray(parsed.mockTests) ? parsed.mockTests : [],
            settings: {
              examDate: parsed.settings?.examDate || "2027-02-06",
              targetScore: parsed.settings?.targetScore || null,
              targetRank: parsed.settings?.targetRank || null
            }
          };
        }
      } catch (e) {
        console.error("Failed to load saved state:", e);
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error("Failed to save state to localStorage:", e);
      }
    }

    /* ==========================================================================
       HABIT CALCULATION ENGINE
       ========================================================================== */

    function isHabitScheduledForDate(habit, dateObj) {
      if (!habit.frequency || habit.frequency === 'daily') return true;
      if (Array.isArray(habit.frequency)) {
        return habit.frequency.includes(dateObj.getDay());
      }
      return true;
    }

    function isHabitCompleted(habit, dateStr) {
      const logVal = appState.habitLogs[dateStr]?.[habit.id];
      if (habit.trackingType === 'binary') {
        return !!logVal;
      } else {
        const target = habit.dailyTarget || 1;
        return (logVal || 0) >= target;
      }
    }

    function calculateStreak(habitId) {
      const habit = appState.habits.find(h => h.id === habitId);
      if (!habit) return 0;

      const todayStr = getToday();
      const todayDone = isHabitCompleted(habit, todayStr);

      let streak = 0;
      let curr = new Date();

      if (todayDone) {
        streak = 1;
        curr.setDate(curr.getDate() - 1);
      } else {
        // Today is not yet completed; walk backward starting yesterday
        curr.setDate(curr.getDate() - 1);
      }

      for (let i = 0; i < 365; i++) {
        const isScheduled = isHabitScheduledForDate(habit, curr);
        const dStr = formatDateYMD(curr);

        if (isScheduled) {
          if (isHabitCompleted(habit, dStr)) {
            streak++;
          } else {
            // Streak ended
            break;
          }
        }
        // If not scheduled, does not break streak
        curr.setDate(curr.getDate() - 1);
      }

      return streak;
    }

    function getTodayHabitsStats() {
      const todayStr = getToday();
      const todayDate = new Date();

      const scheduledHabits = appState.habits.filter(h => isHabitScheduledForDate(h, todayDate));
      const totalToday = scheduledHabits.length;
      const completedToday = scheduledHabits.filter(h => isHabitCompleted(h, todayStr)).length;
      
      const ratio = totalToday > 0 ? (completedToday / totalToday) : 0;
      // SVG Circumference: 2 * PI * 52 ≈ 326.7256
      const strokeDashoffset = totalToday > 0 ? (326.7 * (1 - ratio)).toFixed(1) : '326.7';

      return {
        completedToday,
        totalToday,
        ratio,
        strokeDashoffset,
        percent: totalToday > 0 ? Math.round(ratio * 100) : 0
      };
    }

    /* ==========================================================================
       SYLLABUS CALCULATION ENGINE
       ========================================================================== */

    function getCompletionPercent(subject) {
      if (!subject.topics || subject.topics.length === 0) return 0;
      const totalPoints = subject.topics.length * 3;
      let earned = 0;
      subject.topics.forEach(t => {
        if (t.concept) earned++;
        if (t.pyqs) earned++;
        if (t.notes) earned++;
      });
      return Math.round((earned / totalPoints) * 100);
    }

    function getSyllabusSummary() {
      const totalSubjects = appState.subjects.length;
      if (totalSubjects === 0) {
        return { completedSubjects: 0, totalSubjects: 0, percent: 0, totalTopics: 0 };
      }

      const completedSubjects = appState.subjects.filter(s => {
        return s.topics && s.topics.length > 0 && s.topics.every(t => t.concept && t.pyqs && t.notes);
      }).length;

      let totalTopicPoints = 0;
      let earnedTopicPoints = 0;
      let totalTopics = 0;

      appState.subjects.forEach(s => {
        if (s.topics) {
          totalTopics += s.topics.length;
          totalTopicPoints += s.topics.length * 3;
          s.topics.forEach(t => {
            if (t.concept) earnedTopicPoints++;
            if (t.pyqs) earnedTopicPoints++;
            if (t.notes) earnedTopicPoints++;
          });
        }
      });

      const percent = totalTopicPoints > 0 ? Math.round((earnedTopicPoints / totalTopicPoints) * 100) : 0;

      return { completedSubjects, totalSubjects, percent, totalTopics };
    }

    /* ==========================================================================
       TIMER ENGINE
       ========================================================================== */

    function toggleTimer() {
      if (timerState.isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      timerState.isRunning = true;
      if (!timerInterval) {
        timerInterval = setInterval(timerTick, 1000);
      }
      updateTimerUI();
    }

    function pauseTimer() {
      timerState.isRunning = false;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      updateTimerUI();
    }

    function resetTimer() {
      pauseTimer();
      if (timerState.mode === 'pomodoro') {
        if (timerState.pomodoroType === 'focus') {
          timerState.remainingSeconds = timerState.focusMins * 60;
        } else {
          timerState.remainingSeconds = timerState.breakMins * 60;
        }
      } else {
        timerState.remainingSeconds = 10800; // 3 Hours GATE CBT
      }
      updateTimerUI();
    }

    function switchTimerMode(mode) {
      if (timerState.mode === mode) return;
      pauseTimer();
      timerState.mode = mode;
      if (mode === 'pomodoro') {
        timerState.pomodoroType = 'focus';
        timerState.remainingSeconds = timerState.focusMins * 60;
      } else {
        timerState.remainingSeconds = 10800;
      }
      renderTab('focus');
    }

    function switchPomodoroPhase(type) {
      pauseTimer();
      timerState.pomodoroType = type;
      if (type === 'focus') {
        timerState.remainingSeconds = timerState.focusMins * 60;
      } else {
        timerState.remainingSeconds = timerState.breakMins * 60;
      }
      updateTimerUI();
    }

    function timerTick() {
      if (!timerState.isRunning) return;
      if (timerState.remainingSeconds > 0) {
        timerState.remainingSeconds--;
        updateTimerDisplayOnly();
      } else {
        handleTimerCompletion();
      }
    }

    function handleTimerCompletion() {
      playAudioTone('fanfare');
      if (timerState.mode === 'pomodoro') {
        if (timerState.pomodoroType === 'focus') {
          showToast("Focus session complete! Time for a 10m break ☕", "success");
          timerState.pomodoroType = 'break';
          timerState.remainingSeconds = timerState.breakMins * 60;
        } else {
          showToast("Break finished! Starting deep focus session 🎯", "info");
          timerState.pomodoroType = 'focus';
          timerState.remainingSeconds = timerState.focusMins * 60;
        }
        updateTimerUI();
      } else {
        pauseTimer();
        showToast("GATE CBT 3-Hour Simulation Completed! 🏆", "success");
        timerState.remainingSeconds = 10800;
        updateTimerUI();
      }
    }

    function updateTimerDisplayOnly() {
      const displayEl = document.getElementById('timer-time-display');
      if (displayEl) {
        displayEl.textContent = formatTimer(timerState.remainingSeconds, timerState.mode);
      }
      // Update browser tab title
      document.title = `${formatTimer(timerState.remainingSeconds, timerState.mode)} • GATE 2027 Focus`;
    }

    function updateTimerUI() {
      updateTimerDisplayOnly();
      const btn = document.getElementById('timer-play-btn');
      if (btn) {
        if (timerState.isRunning) {
          btn.innerHTML = `${ICONS.pause} <span>Pause</span>`;
          btn.classList.remove('bg-[var(--primary)]');
          btn.classList.add('bg-[var(--accent)]');
        } else {
          btn.innerHTML = `${ICONS.play} <span>Start</span>`;
          btn.classList.remove('bg-[var(--accent)]');
          btn.classList.add('bg-[var(--primary)]');
        }
      }

      const badge = document.getElementById('pomodoro-phase-badge');
      if (badge) {
        if (timerState.pomodoroType === 'focus') {
          badge.textContent = 'Focus Session';
          badge.style.backgroundColor = 'rgba(59, 130, 246, 0.15)';
          badge.style.borderColor = 'rgba(59, 130, 246, 0.35)';
          badge.style.color = '#60a5fa';
        } else {
          badge.textContent = 'Break Time';
          badge.style.backgroundColor = 'rgba(34, 197, 94, 0.15)';
          badge.style.borderColor = 'rgba(34, 197, 94, 0.35)';
          badge.style.color = '#4ade80';
        }
      }
    }

    function updatePomodoroSettings(focusMins, breakMins) {
      if (focusMins !== null) {
        timerState.focusMins = Math.max(1, parseInt(focusMins, 10) || 50);
      }
      if (breakMins !== null) {
        timerState.breakMins = Math.max(1, parseInt(breakMins, 10) || 10);
      }
      if (!timerState.isRunning) {
        resetTimer();
      }
    }

    /* ==========================================================================
       MODAL CONTROLLER
       ========================================================================== */

    function openModal(htmlContent) {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      content.innerHTML = htmlContent;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      overlay.classList.add('hidden');
      content.innerHTML = '';
    }

    // Close on overlay backdrop tap & ESC key
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') {
        closeModal();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

          const isScheduledToday = isHabitScheduledForDate(habit, todayDate);

          const isDoneToday = isHabitCompleted(habit, todayStr);

          // Build Right Action Control
          let rightActionHtml = '';
          if (habit.trackingType === 'binary') {
            rightActionHtml = `
              <button onclick="toggleBinaryHabit('${habit.id}', this)" class="w-10 h-10 rounded-full flex items-center justify-center transition-all ${isDoneToday ? 'bg-[var(--primary)] text-[var(--primary-foreground)] spring-check shadow-md' : 'border-2 border-[var(--border)] hover:border-[var(--primary)] text-transparent'}">
                ${ICONS.check}
              </button>
            `;
          } else {
            const currentQty = Number(todayVal || 0);
            const targetQty = habit.dailyTarget || 1;
            rightActionHtml = `
              <div class="flex items-center gap-1.5 bg-[var(--content)] px-2 py-1.5 rounded-xl border border-[var(--border)]">
                <button onclick="decrementQuantitativeHabit('${habit.id}')" class="w-7 h-7 rounded-lg bg-[var(--card)] border border-[var(--border)] flex items-center justify-center text-sm font-bold active:scale-90 transition-all">−</button>

              </div>

          }

          // Build 7-cell mini heatmap (ending on today)
          const heatmapCells = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dStr = formatDateYMD(d);
            const dayLetter = ['S', 'M', 'T', 'W', 'T', 'F', 'S'][d.getDay()];
            const isLogged = isHabitCompleted(habit, dStr);
            const isToday = (i === 0);

            heatmapCells.push(`
              <div class="flex flex-col items-center gap-1">
                <span class="text-[9px] text-[var(--muted-foreground)] font-medium">${dayLetter}</span>
                <div class="w-3.5 h-3.5 rounded-sm transition-colors ${isLogged ? 'bg-[var(--primary)]' : 'bg-[var(--border)]'} ${isToday ? 'ring-1 ring-[var(--accent)]' : ''}" title="${dStr}: ${isLogged ? 'Completed' : 'Not completed'}"></div>
              </div>
            `);
          }

          return `
            <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm hover:border-[var(--primary)]/40 transition-all">
              <div class="flex items-start justify-between gap-3">
                <div class="flex items-start gap-3 flex-1 min-w-0">
                  <div class="w-3 h-3 rounded-full mt-1 shrink-0" style="background-color: ${category.color}"></div>
                  <div class="flex-1 min-w-0">
                    <h4 class="font-bold text-sm text-[var(--foreground)] truncate">${escapeHtml(habit.title)}</h4>
                    <div class="flex flex-wrap items-center gap-2 mt-1">
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold" style="color: ${category.color}; background-color: ${category.color}1a; border: 1px solid ${category.color}33;">
                        ${category.label}
                      </span>
                      <span class="text-[11px] font-semibold text-amber-400 flex items-center gap-1">
                        🔥 ${streak} ${streak === 1 ? 'day' : 'days'}
                      </span>
                      ${!isScheduledToday ? `<span class="text-[10px] text-[var(--muted-foreground)] bg-[var(--content)] px-1.5 py-0.5 rounded">Rest Day</span>` : ''}
                    </div>
                  </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                  ${rightActionHtml}
                  <button onclick="openHabitOptionsModal('${habit.id}')" class="w-8 h-8 rounded-lg flex items-center justify-center text-[var(--muted-foreground)] hover:text-[var(--foreground)] hover:bg-[var(--content)] transition-colors">
                    ${ICONS.dots}
                  </button>
                </div>
              </div>

              <!-- Mini 7-Day Heatmap Grid -->
              <div class="flex items-center justify-between pt-3 mt-3 border-t border-[var(--border)]">
                <span class="text-[10px] uppercase font-bold tracking-wider text-[var(--muted-foreground)]">Last 7 Days</span>
                <div class="flex items-center gap-2">
                  ${heatmapCells.join('')}
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      return `
        <div class="tab-content flex flex-col gap-5">
          <!-- Countdown Header -->
          <header class="pt-3 pb-1">
            <div class="flex items-center justify-between">
              <div>
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-[var(--content)] border border-[var(--border)] text-[var(--accent)]">
                  <span class="w-2 h-2 rounded-full bg-[var(--accent)] animate-pulse"></span>
                  GATE 2027 Countdown
                </span>
                <h1 class="text-3xl font-extrabold tracking-tight mt-2 text-[var(--foreground)]">
                  <span class="text-[var(--primary)] font-black text-4xl">${daysLeft}</span> days to GATE 2027
                </h1>
                <p class="text-xs text-[var(--muted-foreground)] mt-0.5 font-medium">February 6, 2027 • CS/IT</p>
              </div>
            </div>
          </header>

          <!-- Daily Habits Progress Ring Card (Apple Fitness Style) -->
          <section class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm flex items-center justify-between gap-4">
            <div>
              <span class="text-[10px] font-bold tracking-wider uppercase text-[var(--primary)]">Daily Ring</span>
              <h3 class="text-xl font-extrabold mt-0.5 text-[var(--foreground)]">${ringStats.completedToday} of ${ringStats.totalToday} Complete</h3>
              <p class="text-xs text-[var(--muted-foreground)] mt-1">
                ${ringStats.totalToday === 0 ? 'No habits scheduled for today' : `${ringStats.percent}% daily target achieved`}
              </p>
            </div>

            <!-- 120x120 Circular Progress Ring -->
            <div class="relative w-[120px] h-[120px] flex items-center justify-center shrink-0">
              <svg width="120" height="120" viewBox="0 0 120 120" class="shrink-0">
                <!-- Background Circle -->
                <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="8" />
                <!-- Foreground Progress Arc -->
                <circle cx="60" cy="60" r="52" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="326.7" stroke-dashoffset="${ringStats.strokeDashoffset}"
                  transform="rotate(-90 60 60)" class="ring-progress" />
                <!-- Centered Text (Kept upright) -->
                <text x="60" y="56" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--foreground)">${ringStats.completedToday}/${ringStats.totalToday}</text>
                <text x="60" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="var(--muted-foreground)" letter-spacing="1">TODAY</text>
              </svg>
            </div>
          </section>

          <!-- Today's Habits Section -->
          <section class="flex flex-col gap-3">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-bold text-[var(--foreground)]">Today's Habits</h2>
              <button onclick="openAddHabitModal()" class="px-3 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] hover:border-[var(--primary)] text-[var(--primary)] text-xs font-bold flex items-center gap-1.5 transition-colors shadow-sm">
                ${ICONS.plus} <span>Add Habit</span>
              </button>
            </div>

            <div class="flex flex-col gap-3">
              ${habitsListHtml}
            </div>
          </section>
        </div>
      `;
    }

    function toggleBinaryHabit(habitId, btnElement) {
      const todayStr = getToday();
      if (!appState.habitLogs[todayStr]) appState.habitLogs[todayStr] = {};
      const current = !!appState.habitLogs[todayStr][habitId];
      const next = !current;
      appState.habitLogs[todayStr][habitId] = next;
      saveData();

      if (next) {
        playAudioTone('check');
        const habit = appState.habits.find(h => h.id === habitId);
        showToast(`Logged: ${habit ? habit.title : 'Habit'}! 🔥`, 'success');
      }

      renderCurrentTab();
    }

    function incrementQuantitativeHabit(habitId, btnElement) {
      const todayStr = getToday();
      if (!appState.habitLogs[todayStr]) appState.habitLogs[todayStr] = {};
      const current = Number(appState.habitLogs[todayStr][habitId] || 0);
      const habit = appState.habits.find(h => h.id === habitId);
      const next = current + 1;
      appState.habitLogs[todayStr][habitId] = next;
      saveData();

      if (habit && next === (habit.dailyTarget || 1)) {
        playAudioTone('check');
        showToast(`Target reached for "${habit.title}"! 🔥`, 'success');
      }

      renderCurrentTab();
    }

    function decrementQuantitativeHabit(habitId) {
      const todayStr = getToday();
      if (!appState.habitLogs[todayStr]) appState.habitLogs[todayStr] = {};
      const current = Number(appState.habitLogs[todayStr][habitId] || 0);
      if (current > 0) {
        appState.habitLogs[todayStr][habitId] = current - 1;
        saveData();
        renderCurrentTab();
      }
    }

          <input type="radio" name="habit-category" value="${cat.id}" ${idx === 0 ? 'checked' : ''} class="accent-[var(--primary)]" />
          <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${cat.color}"></span>
          <span class="text-[var(--foreground)]">${cat.label}</span>
        </label>
      `).join('');

      const daysCheckboxes = DAYS_OF_WEEK.map(day => `
        <label class="flex flex-col items-center gap-1 cursor-pointer">
          <input type="checkbox" name="habit-days" value="${day.id}" checked class="accent-[var(--primary)] w-4 h-4" />
          <span class="text-[10px] font-bold text-[var(--muted-foreground)]">${day.label}</span>

      openModal(`
        <div>
          <div class="flex items-center justify-between pb-3 border-b border-[var(--border)]">
            <h3 class="text-base font-bold text-[var(--foreground)]">Add GATE Habit</h3>
            <button onclick="closeModal()" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)]">

            </button>
          </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Habit Title</label>
              <input type="text" id="habit-title-input" required placeholder="e.g. Solve 20 Algo PYQs" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
            </div>

            <!-- Category -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Category</label>
              <div class="grid grid-cols-2 gap-2">
                ${categoryOptions}
              </div>
            </div>

            <!-- Tracking Type -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Tracking Type</label>
              <div class="grid grid-cols-2 gap-2">

                <button type="button" id="type-quant-btn" onclick="setHabitFormType('quantitative')" class="py-2.5 rounded-xl text-xs font-bold border border-[var(--border)] bg-[var(--content)] text-[var(--muted-foreground)] transition-all">

            <!-- Daily Target (Hidden by default) -->
