              <input type="number" id="habit-target-input" min="1" max="1000" placeholder="e.g. 20 (questions/pages/mins)" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
            </div>

            <!-- Frequency -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Frequency</label>
              <div class="flex gap-2 mb-2.5">
                <button type="button" id="freq-daily-btn" onclick="setHabitFreqMode('daily')" class="flex-1 py-2 rounded-xl text-xs font-bold border border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)]">
                  Daily
                </button>
                <button type="button" id="freq-custom-btn" onclick="setHabitFreqMode('custom')" class="flex-1 py-2 rounded-xl text-xs font-bold border border-[var(--border)] bg-[var(--content)] text-[var(--muted-foreground)]">
                  Custom Days
                </button>
              </div>
              <input type="hidden" id="habit-freq-mode" value="daily" />

              <div id="custom-days-picker" class="hidden p-3 bg-[var(--content)] border border-[var(--border)] rounded-xl flex items-center justify-around">
                ${daysCheckboxes}
              </div>
            </div>

            <!-- Actions -->
            <div class="flex gap-3 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--content)] text-xs font-semibold hover:bg-[var(--border)] transition-colors">
                Cancel
              </button>
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-md hover:opacity-90 transition-opacity">
                Save Habit
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function setHabitFormType(type) {
      document.getElementById('habit-type-val').value = type;
      const binBtn = document.getElementById('type-binary-btn');
      const quantBtn = document.getElementById('type-quant-btn');
      const quantContainer = document.getElementById('quant-target-container');

      if (type === 'binary') {
        binBtn.className = "py-2.5 rounded-xl text-xs font-bold border border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)] transition-all";
        quantBtn.className = "py-2.5 rounded-xl text-xs font-bold border border-[var(--border)] bg-[var(--content)] text-[var(--muted-foreground)] transition-all";
        quantContainer.classList.add('hidden');
      } else {
        quantBtn.className = "py-2.5 rounded-xl text-xs font-bold border border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)] transition-all";
        binBtn.className = "py-2.5 rounded-xl text-xs font-bold border border-[var(--border)] bg-[var(--content)] text-[var(--muted-foreground)] transition-all";
        quantContainer.classList.remove('hidden');
      }
    }

    function setHabitFreqMode(mode) {
      document.getElementById('habit-freq-mode').value = mode;
      const dailyBtn = document.getElementById('freq-daily-btn');
      const customBtn = document.getElementById('freq-custom-btn');
      const picker = document.getElementById('custom-days-picker');

      if (mode === 'daily') {
        dailyBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold border border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)]";
        customBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold border border-[var(--border)] bg-[var(--content)] text-[var(--muted-foreground)]";
        picker.classList.add('hidden');
      } else {
        customBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold border border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)]";
        dailyBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold border border-[var(--border)] bg-[var(--content)] text-[var(--muted-foreground)]";
        picker.classList.remove('hidden');
      }
    }

    function handleSaveNewHabit(e) {
      e.preventDefault();
      const title = document.getElementById('habit-title-input').value.trim();
      const category = document.querySelector('input[name="habit-category"]:checked')?.value || 'core_subject';
      const trackingType = document.getElementById('habit-type-val').value;
      const dailyTarget = trackingType === 'quantitative' ? (parseInt(document.getElementById('habit-target-input').value, 10) || 1) : null;
      const freqMode = document.getElementById('habit-freq-mode').value;

      let frequency = 'daily';
      if (freqMode === 'custom') {
        const checkedBoxes = Array.from(document.querySelectorAll('input[name="habit-days"]:checked')).map(cb => parseInt(cb.value, 10));
        frequency = checkedBoxes.length > 0 ? checkedBoxes : 'daily';
      }

      if (!title) {
        showToast("Please enter a habit title", "warning");
        return;
      }

      const newHabit = {
        id: generateId(),
        title,
        category,
        trackingType,
        dailyTarget,
        frequency,
        streak: 0,
        createdAt: new Date().toISOString()
      };

      appState.habits.push(newHabit);
      saveData();
      closeModal();
      showToast("GATE Habit added!", "success");
      renderCurrentTab();
    }

    function openHabitOptionsModal(habitId) {
      const habit = appState.habits.find(h => h.id === habitId);
      if (!habit) return;

      openModal(`
        <div>
          <div class="flex items-center justify-between pb-3 border-b border-[var(--border)]">
            <h3 class="text-base font-bold text-[var(--foreground)] truncate">${escapeHtml(habit.title)}</h3>
            <button onclick="closeModal()" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
              ${ICONS.close}
            </button>
          </div>

          <div class="mt-4 flex flex-col gap-2.5">
            <button onclick="openEditHabitModal('${habit.id}')" class="w-full py-3 px-4 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-bold text-left hover:border-[var(--primary)] text-[var(--foreground)] flex items-center justify-between">
              <span>Edit Habit</span>
              <span>✏️</span>
            </button>

            <button onclick="handleDeleteHabit('${habit.id}')" class="w-full py-3 px-4 rounded-xl bg-red-500/10 border border-red-500/30 text-xs font-bold text-left text-red-400 hover:bg-red-500/20 flex items-center justify-between">
              <span>Delete Habit</span>
              <span>🗑️</span>
            </button>

            <button onclick="closeModal()" class="w-full py-2.5 mt-2 rounded-xl border border-[var(--border)] text-xs font-semibold text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
              Cancel
            </button>
          </div>
        </div>
      `);
    }

    function openEditHabitModal(habitId) {
      const habit = appState.habits.find(h => h.id === habitId);
      if (!habit) return;

      const categoryOptions = Object.values(CATEGORIES).map(cat => `
        <label class="flex items-center gap-2 p-2.5 rounded-xl border border-[var(--border)] bg-[var(--content)] cursor-pointer text-xs font-semibold hover:border-[var(--primary)] transition-colors">
          <input type="radio" name="edit-habit-category" value="${cat.id}" ${habit.category === cat.id ? 'checked' : ''} class="accent-[var(--primary)]" />
          <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${cat.color}"></span>
          <span class="text-[var(--foreground)]">${cat.label}</span>
        </label>
      `).join('');

      openModal(`
        <div>
          <div class="flex items-center justify-between pb-3 border-b border-[var(--border)]">
            <h3 class="text-base font-bold text-[var(--foreground)]">Edit Habit</h3>
            <button onclick="closeModal()" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
              ${ICONS.close}
            </button>
          </div>

          <form onsubmit="handleUpdateHabit(event, '${habit.id}')" class="mt-4 flex flex-col gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Habit Title</label>
              <input type="text" id="edit-habit-title" required value="${escapeHtml(habit.title)}" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Category</label>
              <div class="grid grid-cols-2 gap-2">
                ${categoryOptions}
              </div>
            </div>

            ${habit.trackingType === 'quantitative' ? `
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Daily Target</label>
                <input type="number" id="edit-habit-target" min="1" max="1000" value="${habit.dailyTarget || 1}" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
              </div>
            ` : ''}

            <div class="flex gap-3 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--content)] text-xs font-semibold hover:bg-[var(--border)]">
                Cancel
              </button>
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-md hover:opacity-90">
                Update Habit
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function handleUpdateHabit(e, habitId) {
      e.preventDefault();
      const habit = appState.habits.find(h => h.id === habitId);
      if (!habit) return;

      const title = document.getElementById('edit-habit-title').value.trim();
      const category = document.querySelector('input[name="edit-habit-category"]:checked')?.value || habit.category;
      
      if (!title) {
        showToast("Habit title cannot be empty", "warning");
        return;
      }

      habit.title = title;
      habit.category = category;

      if (habit.trackingType === 'quantitative') {
        const targetVal = parseInt(document.getElementById('edit-habit-target')?.value, 10);
        if (targetVal > 0) habit.dailyTarget = targetVal;
      }

      saveData();
      closeModal();
      showToast("Habit updated!", "success");
      renderCurrentTab();
    }

    function handleDeleteHabit(habitId) {
      const habit = appState.habits.find(h => h.id === habitId);
      if (!habit) return;

      if (confirm(`Delete habit "${habit.title}"?`)) {
        appState.habits = appState.habits.filter(h => h.id !== habitId);
        // Clean orphaned logs
        Object.keys(appState.habitLogs).forEach(dateStr => {
          if (appState.habitLogs[dateStr]) {
            delete appState.habitLogs[dateStr][habitId];
          }
        });
        saveData();
        closeModal();
        showToast("Habit deleted", "info");
        renderCurrentTab();
      }
    }

    /* ==========================================================================
       TAB 2: SYLLABUS CONTROLLER & VIEWS
       ========================================================================== */

    function renderSyllabusTab() {
      const summary = getSyllabusSummary();

      let subjectsListHtml = '';

      if (appState.subjects.length === 0) {
        // Empty state when subjects = []
        subjectsListHtml = `
          <div class="flex flex-col items-center justify-center p-8 text-center bg-[var(--card)] border border-[var(--border)] rounded-2xl my-2 shadow-sm">
            <div class="w-16 h-16 rounded-2xl bg-[var(--content)] border border-[var(--border)] flex items-center justify-center text-3xl shadow-sm mb-4">
              📚
            </div>
            <h3 class="text-lg font-bold text-[var(--foreground)]">Your syllabus awaits</h3>
            <p class="text-xs text-[var(--muted-foreground)] max-w-[240px] mt-1 mb-5 leading-relaxed">
              Add subjects and track your mastery topic by topic
            </p>
            <button onclick="openAddSubjectModal()" class="px-5 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-md hover:opacity-90 active:scale-95 transition-all flex items-center gap-2">
              ${ICONS.plus} <span>Add Subject</span>
            </button>
          </div>
        `;
      } else {
        subjectsListHtml = appState.subjects.map(subject => {
          const percent = getCompletionPercent(subject);
          const isExpanded = expandedSubjects.has(subject.id);
          const topics = subject.topics || [];

          let topicsRowsHtml = '';
          if (topics.length === 0) {
            topicsRowsHtml = `
              <div class="py-4 text-center text-xs text-[var(--muted-foreground)]">
                No topics added yet. Click "+ Add Topic" below to get started.
              </div>
            `;
          } else {
            topicsRowsHtml = topics.map(topic => {
              const topicDone = topic.concept && topic.pyqs && topic.notes;
              return `
                <div class="p-3 rounded-xl bg-[var(--content)] border border-[var(--border)] flex flex-col gap-2.5">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs font-bold ${topicDone ? 'line-through text-[var(--muted-foreground)]' : 'text-[var(--foreground)]'}">
                      ${escapeHtml(topic.name)}
                    </span>
                    <button onclick="deleteTopic('${subject.id}', '${topic.id}')" class="text-[var(--muted-foreground)] hover:text-red-400 p-1">
                      ${ICONS.trash}
                    </button>
                  </div>

                  <!-- 3 Toggle Buttons in a row: Concept, PYQs, Notes -->
                  <div class="grid grid-cols-3 gap-1.5">
                    <!-- Concept Toggle -->
                    <button type="button" onclick="toggleTopicItem('${subject.id}', '${topic.id}', 'concept')" class="py-1.5 px-2 rounded-lg text-[11px] font-bold border flex items-center justify-center gap-1 transition-all ${topic.concept ? 'bg-[var(--accent)] text-white border-[var(--accent)] shadow-sm' : 'bg-[var(--card)] text-[var(--muted-foreground)] border-[var(--border)] hover:border-[var(--accent)]'}">
                      <span>📖</span>
                      <span>Concept</span>
                    </button>

                    <!-- PYQs Toggle -->
                    <button type="button" onclick="toggleTopicItem('${subject.id}', '${topic.id}', 'pyqs')" class="py-1.5 px-2 rounded-lg text-[11px] font-bold border flex items-center justify-center gap-1 transition-all ${topic.pyqs ? 'bg-[var(--accent)] text-white border-[var(--accent)] shadow-sm' : 'bg-[var(--card)] text-[var(--muted-foreground)] border-[var(--border)] hover:border-[var(--accent)]'}">
                      <span>✏️</span>
                      <span>PYQs</span>
                    </button>

                    <!-- Notes Toggle -->
                    <button type="button" onclick="toggleTopicItem('${subject.id}', '${topic.id}', 'notes')" class="py-1.5 px-2 rounded-lg text-[11px] font-bold border flex items-center justify-center gap-1 transition-all ${topic.notes ? 'bg-[var(--accent)] text-white border-[var(--accent)] shadow-sm' : 'bg-[var(--card)] text-[var(--muted-foreground)] border-[var(--border)] hover:border-[var(--accent)]'}">
                      <span>📝</span>
                      <span>Notes</span>
                    </button>
                  </div>
                </div>
              `;
            }).join('');
          }

          return `
            <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm">
              <!-- Subject Header Clickable Accordion -->
              <div onclick="toggleSubjectAccordion('${subject.id}')" class="cursor-pointer flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5 flex-1 min-w-0">
                  <div class="w-3.5 h-3.5 rounded-full shrink-0" style="background-color: ${subject.color || 'var(--primary)'}"></div>
                  <div class="flex-1 min-w-0">
                    <h3 class="font-bold text-sm text-[var(--foreground)] truncate">${escapeHtml(subject.name)}</h3>
                    <p class="text-[11px] text-[var(--muted-foreground)] mt-0.5">${topics.length} ${topics.length === 1 ? 'topic' : 'topics'} • ${percent}% mastered</p>
                  </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                  <span class="text-xs font-bold px-2 py-1 rounded-lg bg-[var(--content)] border border-[var(--border)] text-[var(--foreground)]">${percent}%</span>
                  <div class="text-[var(--muted-foreground)]">
                    ${isExpanded ? ICONS.chevronUp : ICONS.chevronDown}
                  </div>
                </div>
              </div>

              <!-- Animated Completion Bar -->
              <div class="w-full bg-[var(--content)] h-2 rounded-full overflow-hidden mt-3 border border-[var(--border)]">
                <div class="h-full rounded-full transition-all duration-500" style="width: ${percent}%; background-color: ${subject.color || 'var(--primary)'}"></div>
              </div>

              <!-- Expanded View Topics List -->
              ${isExpanded ? `
                <div class="mt-4 pt-3 border-t border-[var(--border)] flex flex-col gap-3">
                  <div class="flex items-center justify-between">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Subject Topics</span>
                    <div class="flex items-center gap-2">
                      <button onclick="openAddTopicModal('${subject.id}')" class="px-2.5 py-1 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold flex items-center gap-1 shadow-sm">
                        ${ICONS.plus} <span>Topic</span>
                      </button>
                      <button onclick="deleteSubject('${subject.id}')" class="p-1 text-[var(--muted-foreground)] hover:text-red-400">
                        ${ICONS.trash}
                      </button>
                    </div>
                  </div>

                  <div class="flex flex-col gap-2 mt-1">
                    ${topicsRowsHtml}
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      }

      return `
        <div class="tab-content flex flex-col gap-5">
          <!-- Syllabus Header -->
          <header class="pt-3 pb-1 flex items-center justify-between">
            <div>
              <h1 class="text-2xl font-extrabold tracking-tight text-[var(--foreground)]">GATE Syllabus Tracker</h1>
              <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
                ${summary.completedSubjects} of ${summary.totalSubjects} subjects complete (${summary.percent}% syllabus)
              </p>
            </div>
            <button onclick="openAddSubjectModal()" class="px-3.5 py-2 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-md hover:opacity-90 flex items-center gap-1.5 transition-all">
              ${ICONS.plus} <span>Add Subject</span>
            </button>
          </header>

          <!-- Overall Syllabus Progress Bar -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm">
            <div class="flex items-center justify-between text-xs font-bold mb-2">
              <span class="text-[var(--muted-foreground)]">Total Mastery Progress</span>
              <span class="text-[var(--primary)]">${summary.percent}%</span>
            </div>
            <div class="w-full bg-[var(--content)] h-2.5 rounded-full overflow-hidden border border-[var(--border)]">
              <div class="h-full bg-[var(--primary)] rounded-full transition-all duration-600" style="width: ${summary.percent}%"></div>
            </div>
          </div>

          <!-- Subjects List -->
          <div class="flex flex-col gap-3">
            ${subjectsListHtml}
          </div>
        </div>
      `;
    }

    function toggleSubjectAccordion(subjectId) {
      if (expandedSubjects.has(subjectId)) {
        expandedSubjects.delete(subjectId);
      } else {
        expandedSubjects.add(subjectId);
      }
      renderCurrentTab();
    }

    function toggleTopicItem(subjectId, topicId, field) {
      const subject = appState.subjects.find(s => s.id === subjectId);
      if (!subject) return;
      const topic = subject.topics.find(t => t.id === topicId);
      if (!topic) return;

      topic[field] = !topic[field];
      saveData();

      if (topic.concept && topic.pyqs && topic.notes) {
        playAudioTone('check');
        showToast(`Topic "${topic.name}" 100% finished! 🚀`, 'success');
      }

      renderCurrentTab();
    }

    function deleteSubject(subjectId) {
      const subject = appState.subjects.find(s => s.id === subjectId);
      if (!subject) return;

      if (confirm(`Delete subject "${subject.name}" and all its topics?`)) {
        appState.subjects = appState.subjects.filter(s => s.id !== subjectId);
        expandedSubjects.delete(subjectId);
        saveData();
        showToast("Subject deleted", "info");
        renderCurrentTab();
      }
    }

    function deleteTopic(subjectId, topicId) {
      const subject = appState.subjects.find(s => s.id === subjectId);
      if (!subject) return;

      subject.topics = subject.topics.filter(t => t.id !== topicId);
      saveData();
      showToast("Topic removed", "info");
      renderCurrentTab();
    }

    function openAddSubjectModal() {
      const colorPresetsHtml = SUBJECT_PRESET_COLORS.map((color, idx) => `
        <label class="cursor-pointer">
          <input type="radio" name="subject-color" value="${color}" ${idx === 0 ? 'checked' : ''} class="hidden peer" />
          <div class="w-8 h-8 rounded-full border-2 border-transparent peer-checked:border-[var(--foreground)] peer-checked:scale-110 transition-all shadow-sm flex items-center justify-center" style="background-color: ${color}"></div>
        </label>
      `).join('');

      openModal(`
        <div>
          <div class="flex items-center justify-between pb-3 border-b border-[var(--border)]">
            <h3 class="text-base font-bold text-[var(--foreground)]">Add GATE Subject</h3>
            <button onclick="closeModal()" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
              ${ICONS.close}
            </button>
          </div>

          <form onsubmit="handleSaveSubject(event)" class="mt-4 flex flex-col gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Subject Name</label>
              <input type="text" id="subject-name-input" required placeholder="e.g. Operating Systems / Algorithms" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Accent Color</label>
              <div class="flex items-center gap-3 pt-1">
                ${colorPresetsHtml}
              </div>
            </div>

            <div class="flex gap-3 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--content)] text-xs font-semibold hover:bg-[var(--border)]">
                Cancel
              </button>
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-md hover:opacity-90">
                Save Subject
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function handleSaveSubject(e) {
      e.preventDefault();
      const name = document.getElementById('subject-name-input').value.trim();
      const color = document.querySelector('input[name="subject-color"]:checked')?.value || SUBJECT_PRESET_COLORS[0];

      if (!name) {
        showToast("Please enter a subject name", "warning");
        return;
      }

      const newSubject = {
        id: generateId(),
        name,
        color,
        topics: [],
        createdAt: new Date().toISOString()
      };

      appState.subjects.push(newSubject);
      expandedSubjects.add(newSubject.id); // Expand new subject automatically
      saveData();
      closeModal();
      showToast(`Subject "${name}" added!`, "success");
      renderCurrentTab();
    }

    function openAddTopicModal(subjectId) {
      const subject = appState.subjects.find(s => s.id === subjectId);
      if (!subject) return;

      openModal(`
        <div>
          <div class="flex items-center justify-between pb-3 border-b border-[var(--border)]">
            <h3 class="text-base font-bold text-[var(--foreground)]">Add Topic to ${escapeHtml(subject.name)}</h3>
            <button onclick="closeModal()" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
              ${ICONS.close}
            </button>
          </div>

          <form onsubmit="handleSaveTopic(event, '${subject.id}')" class="mt-4 flex flex-col gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Topic Name</label>
              <input type="text" id="topic-name-input" required placeholder="e.g. CPU Scheduling & Concurrency" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
            </div>

            <div class="flex gap-3 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--content)] text-xs font-semibold hover:bg-[var(--border)]">
                Cancel
              </button>
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-md hover:opacity-90">
                Save Topic
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function handleSaveTopic(e, subjectId) {
      e.preventDefault();
      const subject = appState.subjects.find(s => s.id === subjectId);
      if (!subject) return;

      const name = document.getElementById('topic-name-input').value.trim();
      if (!name) {
        showToast("Please enter a topic name", "warning");
        return;
      }

      if (!subject.topics) subject.topics = [];

      subject.topics.push({
        id: generateId(),
        name,
        concept: false,
        pyqs: false,
        notes: false
      });

      expandedSubjects.add(subjectId);
      saveData();
      closeModal();
      showToast("Topic added!", "success");
      renderCurrentTab();
    }

    /* ==========================================================================
       TAB 3: FOCUS CONTROLLER & VIEWS
       ========================================================================== */

    function renderFocusTab() {
      // Mock Tests List Html
      let mockTestsHtml = '';

      if (appState.mockTests.length === 0) {
        // Empty state when mockTests = []
        mockTestsHtml = `
          <div class="flex flex-col items-center justify-center p-8 text-center bg-[var(--card)] border border-[var(--border)] rounded-2xl my-2 shadow-sm">
            <div class="w-16 h-16 rounded-2xl bg-[var(--content)] border border-[var(--border)] flex items-center justify-center text-3xl shadow-sm mb-4">
              📊
            </div>
            <h3 class="text-lg font-bold text-[var(--foreground)]">No tests logged yet</h3>
            <p class="text-xs text-[var(--muted-foreground)] max-w-[240px] mt-1 mb-5 leading-relaxed">
              Log your first mock test to track progress
            </p>
            <button onclick="openLogTestModal()" class="px-5 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-md hover:opacity-90 active:scale-95 transition-all flex items-center gap-2">
              ${ICONS.plus} <span>Log First Test</span>
            </button>
          </div>
        `;
      } else {
        mockTestsHtml = appState.mockTests.map(test => {
          const totalMarks = test.totalMarks || 100;
          const scored = test.scored || 0;
          const pct = totalMarks > 0 ? (scored / totalMarks) * 100 : 0;

          // Color-coded score: >=80 green, 60-79 yellow, <60 red
          let scoreBadgeStyle = '';
          if (pct >= 80) {
            scoreBadgeStyle = 'color: #22c55e; background-color: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.3);';
          } else if (pct >= 60) {
            scoreBadgeStyle = 'color: #eab308; background-color: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.3);';
          } else {
            scoreBadgeStyle = 'color: #ef4444; background-color: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3);';
          }

          return `
            <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm flex flex-col gap-2.5">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h4 class="font-bold text-sm text-[var(--foreground)]">${escapeHtml(test.name)}</h4>
                  <p class="text-[11px] text-[var(--muted-foreground)] mt-0.5">${formatDateNice(test.date)}</p>
                </div>
                <button onclick="deleteMockTest('${test.id}')" class="text-[var(--muted-foreground)] hover:text-red-400 p-1">
                  ${ICONS.trash}
                </button>
              </div>

              <!-- Score & Accuracy Badges -->
              <div class="flex items-center gap-2 pt-1">
                <span class="px-2.5 py-1 rounded-xl text-xs font-bold" style="${scoreBadgeStyle}">
                  ${scored} / ${totalMarks} (${pct.toFixed(1)}%)
                </span>
                <span class="px-2.5 py-1 rounded-xl text-xs font-bold bg-[var(--content)] border border-[var(--border)] text-[var(--foreground)]">
                  Accuracy: ${test.accuracy}%
                </span>
              </div>

              <!-- Mistake / Trap Note -->
              ${test.mistakeNote ? `
                <div class="mt-1 p-2.5 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs text-[var(--muted-foreground)] leading-relaxed flex items-start gap-2">
                  <span class="text-amber-400 text-sm">⚠️</span>
                  <div class="flex-1">
                    <span class="font-bold text-[var(--foreground)] block text-[11px] uppercase tracking-wider mb-0.5">Mistake / Trap Note:</span>
                    <span>${escapeHtml(test.mistakeNote)}</span>
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      }

      return `
        <div class="tab-content flex flex-col gap-6">
          <!-- Deep Work Timer Section -->
          <section class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm flex flex-col items-center">
            <!-- Mode Tabs (Pomodoro vs GATE CBT) -->
            <div class="flex w-full bg-[var(--content)] p-1 rounded-xl border border-[var(--border)] mb-4">
              <button onclick="switchTimerMode('pomodoro')" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${timerState.mode === 'pomodoro' ? 'bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm' : 'text-[var(--muted-foreground)]'}">
                Pomodoro
              </button>
              <button onclick="switchTimerMode('cbt')" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${timerState.mode === 'cbt' ? 'bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm' : 'text-[var(--muted-foreground)]'}">
                GATE CBT (3hr)
              </button>
            </div>

            <!-- Mode Badges -->
            ${timerState.mode === 'pomodoro' ? `
              <span id="pomodoro-phase-badge" class="px-3 py-1 rounded-full text-xs font-bold border mb-2 transition-all" style="${timerState.pomodoroType === 'focus' ? 'background-color: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.35); color: #60a5fa;' : 'background-color: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.35); color: #4ade80;'}">
                ${timerState.pomodoroType === 'focus' ? 'Focus Session' : 'Break Time'}
              </span>
            ` : `
              <span class="px-3 py-1 rounded-full text-xs font-bold border mb-2 bg-purple-500/15 border-purple-500/35 text-purple-400">
                Simulating GATE 2027 CBT Exam
              </span>
            `}

            <!-- Monospace Digital Countdown Display -->
            <div class="py-4">
              <span id="timer-time-display" class="timer-display text-5xl sm:text-6xl font-black tracking-wider text-[var(--foreground)]">
                ${formatTimer(timerState.remainingSeconds, timerState.mode)}
              </span>
            </div>

            <!-- Timer Action Buttons -->
            <div class="flex items-center gap-3 w-full max-w-xs mt-2">
              <button id="timer-play-btn" onclick="toggleTimer()" class="flex-1 py-3 rounded-xl ${timerState.isRunning ? 'bg-[var(--accent)]' : 'bg-[var(--primary)]'} text-[var(--primary-foreground)] font-bold text-xs shadow-md flex items-center justify-center gap-2 active:scale-95 transition-all">
                ${timerState.isRunning ? `${ICONS.pause} <span>Pause</span>` : `${ICONS.play} <span>Start</span>`}
              </button>
              <button onclick="resetTimer()" class="py-3 px-4 rounded-xl bg-[var(--content)] border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95 transition-all">
                ${ICONS.reset} <span>Reset</span>
              </button>
            </div>

            <!-- Editable Focus & Break Durations (Pomodoro Mode Only) -->
            ${timerState.mode === 'pomodoro' ? `
              <div class="flex items-center justify-center gap-3 mt-5 pt-4 border-t border-[var(--border)] w-full text-xs text-[var(--muted-foreground)]">
                <label class="flex items-center gap-1.5 bg-[var(--content)] px-3 py-1.5 rounded-xl border border-[var(--border)]">
                  <span>Focus:</span>
                  <input type="number" min="1" max="180" value="${timerState.focusMins}" onchange="updatePomodoroSettings(this.value, null)" class="w-10 bg-transparent text-[var(--foreground)] font-bold text-center outline-none" />
                  <span>m</span>
                </label>
                <label class="flex items-center gap-1.5 bg-[var(--content)] px-3 py-1.5 rounded-xl border border-[var(--border)]">
                  <span>Break:</span>
                  <input type="number" min="1" max="60" value="${timerState.breakMins}" onchange="updatePomodoroSettings(null, this.value)" class="w-10 bg-transparent text-[var(--foreground)] font-bold text-center outline-none" />
                  <span>m</span>
                </label>
              </div>
            ` : ''}
          </section>

          <!-- Mock Test Log Section -->
          <section class="flex flex-col gap-3">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-bold text-[var(--foreground)]">Mock Test Log</h2>
              <button onclick="openLogTestModal()" class="px-3 py-1.5 rounded-xl bg-[var(--content)] border border-[var(--border)] hover:border-[var(--primary)] text-[var(--primary)] text-xs font-bold flex items-center gap-1.5 transition-colors shadow-sm">
                ${ICONS.plus} <span>Log Test</span>
              </button>
            </div>

            <div class="flex flex-col gap-3">
              ${mockTestsHtml}
            </div>
          </section>
        </div>
      `;
    }

    function openLogTestModal() {
      openModal(`
        <div>
          <div class="flex items-center justify-between pb-3 border-b border-[var(--border)]">
            <h3 class="text-base font-bold text-[var(--foreground)]">Log GATE Mock Test</h3>
            <button onclick="closeModal()" class="text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
              ${ICONS.close}
            </button>
          </div>

          <form onsubmit="handleSaveMockTest(event)" class="mt-4 flex flex-col gap-3.5">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Date</label>
              <input type="date" id="test-date-input" required value="${getToday()}" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2 text-xs text-[var(--foreground)] outline-none" />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Test Name</label>
              <input type="text" id="test-name-input" required placeholder="e.g. Made Easy CBT Mock 1 / ACE Full Mock" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Total Marks</label>
                <input type="number" id="test-total-input" step="any" min="1" value="100" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2 text-xs text-[var(--foreground)] outline-none" oninput="autoComputeAccuracy()" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Marks Scored</label>
                <input type="number" id="test-scored-input" step="any" required placeholder="e.g. 68.5" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2 text-xs text-[var(--foreground)] outline-none" oninput="autoComputeAccuracy()" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Accuracy %</label>
              <input type="number" id="test-accuracy-input" step="any" min="0" max="100" placeholder="e.g. 84" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2 text-xs text-[var(--foreground)] outline-none" />
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1.5">Mistake / Trap Note</label>
              <textarea id="test-note-input" rows="3" placeholder="Identify negative marks, conceptual gaps, and traps to avoid..." class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2 text-xs text-[var(--foreground)] outline-none resize-none"></textarea>
            </div>

            <div class="flex gap-3 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--content)] text-xs font-semibold hover:bg-[var(--border)]">
                Cancel
              </button>
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-md hover:opacity-90">
                Save Test
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function autoComputeAccuracy() {
      const total = parseFloat(document.getElementById('test-total-input')?.value);
      const scored = parseFloat(document.getElementById('test-scored-input')?.value);
      const accInput = document.getElementById('test-accuracy-input');
      if (accInput && !isNaN(total) && total > 0 && !isNaN(scored)) {
        const est = Math.max(0, Math.min(100, Math.round((scored / total) * 100)));
        accInput.value = est;
      }
    }

    function handleSaveMockTest(e) {
      e.preventDefault();
      const date = document.getElementById('test-date-input').value || getToday();
      const name = document.getElementById('test-name-input').value.trim();
      const totalMarks = parseFloat(document.getElementById('test-total-input').value) || 100;
      const scored = parseFloat(document.getElementById('test-scored-input').value) || 0;
      let accuracy = parseFloat(document.getElementById('test-accuracy-input').value);
      if (isNaN(accuracy)) {
        accuracy = totalMarks > 0 ? Math.round((scored / totalMarks) * 100) : 0;
      }
      const mistakeNote = document.getElementById('test-note-input').value.trim();

      if (!name) {
        showToast("Please enter a test name", "warning");
        return;
      }

      const newTest = {
        id: generateId(),
        date,
        name,
        totalMarks,
        scored,
        accuracy,
        mistakeNote,
        createdAt: new Date().toISOString()
      };

      appState.mockTests.unshift(newTest);
      saveData();
      closeModal();
      showToast("Mock test logged successfully!", "success");
      renderCurrentTab();
    }

    function deleteMockTest(testId) {
      if (confirm("Delete this mock test log?")) {
        appState.mockTests = appState.mockTests.filter(t => t.id !== testId);
        saveData();
        showToast("Test log deleted", "info");
        renderCurrentTab();
      }
    }

    /* ==========================================================================
       TAB 4: SETTINGS CONTROLLER & VIEWS
       ========================================================================== */

    function renderSettingsTab() {
      const examDate = (appState.settings && appState.settings.examDate) || '2027-02-06';
      const targetScore = (appState.settings && appState.settings.targetScore) ?? '';
      const targetRank = (appState.settings && appState.settings.targetRank) ?? '';

      return `
        <div class="tab-content flex flex-col gap-6">
          <header class="pt-3 pb-1">
            <h1 class="text-2xl font-extrabold tracking-tight text-[var(--foreground)]">Settings & Preferences</h1>
            <p class="text-xs text-[var(--muted-foreground)] mt-0.5">Configure exam milestones and manage backups</p>
          </header>

          <!-- Exam Configuration Card -->
          <section class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm">
            <h2 class="text-sm font-bold text-[var(--foreground)] mb-3">Exam Configuration</h2>
            <form onsubmit="handleSaveSettings(event)" class="flex flex-col gap-3.5">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1">GATE Exam Date</label>
                <input type="date" id="setting-exam-date" value="${examDate}" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1">Target Score (out of 100)</label>
                  <input type="number" id="setting-target-score" min="1" max="100" value="${targetScore}" placeholder="e.g. 78" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)] mb-1">Target Rank (AIR)</label>
                  <input type="number" id="setting-target-rank" min="1" value="${targetRank}" placeholder="e.g. 100" class="w-full bg-[var(--content)] border border-[var(--border)] focus:border-[var(--primary)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--foreground)] outline-none" />
                </div>
              </div>

              <button type="submit" class="mt-2 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-bold shadow-md hover:opacity-90 transition-opacity">
                Save Exam Configuration
              </button>
            </form>
          </section>

          <!-- Data Management Card -->
          <section class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm flex flex-col gap-3">
            <h2 class="text-sm font-bold text-[var(--foreground)]">Data Management</h2>
            <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">
              Export your study data as a JSON file or restore from a previous backup.
            </p>

            <div class="flex flex-col sm:flex-row gap-2.5 mt-1">
              <button onclick="exportDataJSON()" class="flex-1 py-2.5 px-3 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-bold hover:border-[var(--primary)] text-[var(--foreground)] flex items-center justify-center gap-2 transition-all">
                ${ICONS.download} <span>Export Data (JSON)</span>
              </button>

              <button onclick="triggerImportJSON()" class="flex-1 py-2.5 px-3 rounded-xl bg-[var(--content)] border border-[var(--border)] text-xs font-bold hover:border-[var(--primary)] text-[var(--foreground)] flex items-center justify-center gap-2 transition-all">
                ${ICONS.upload} <span>Import Data</span>
              </button>
            </div>

            <!-- Danger Zone: Reset Data -->
            <div class="pt-3 mt-1 border-t border-[var(--border)]">
              <button onclick="openResetConfirmationModal()" class="w-full py-2.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-bold hover:bg-red-500/20 transition-colors">
                Reset All Data
              </button>
            </div>
          </section>

          <!-- App Info Card -->
          <section class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm text-center">
            <h3 class="font-extrabold text-sm text-[var(--foreground)]">GATE 2027 Tracker</h3>
            <p class="text-[11px] text-[var(--muted-foreground)] mt-0.5">Version 1.0.0 • Built for CS/IT Engineering</p>
            <p class="text-[10px] text-[var(--muted-foreground)] mt-2">Consistent daily effort compounds to top ranks.</p>
          </section>
        </div>
      `;
    }

    function handleSaveSettings(e) {
      e.preventDefault();
      const examDate = document.getElementById('setting-exam-date').value || "2027-02-06";
      const targetScore = document.getElementById('setting-target-score').value ? parseFloat(document.getElementById('setting-target-score').value) : null;
      const targetRank = document.getElementById('setting-target-rank').value ? parseInt(document.getElementById('setting-target-rank').value, 10) : null;

      appState.settings = {
        examDate,
        targetScore,
        targetRank
      };

      saveData();
      showToast("Exam settings saved!", "success");
      renderCurrentTab();
    }

    function exportDataJSON() {
      try {
        const payload = JSON.stringify(appState, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gate2027_tracker_backup_${getToday()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast("Backup exported successfully!", "success");
      } catch (e) {
        showToast("Failed to export backup", "warning");
      }
    }

    function triggerImportJSON() {
      const input = document.getElementById('json-file-input');
      if (input) input.click();
    }

    function handleFileImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (typeof parsed !== 'object' || parsed === null) {
            throw new Error("Invalid format");
          }

          appState = {
            habits: Array.isArray(parsed.habits) ? parsed.habits : [],
            habitLogs: typeof parsed.habitLogs === 'object' && parsed.habitLogs !== null ? parsed.habitLogs : {},
            subjects: Array.isArray(parsed.subjects) ? parsed.subjects : [],
            mockTests: Array.isArray(parsed.mockTests) ? parsed.mockTests : [],
            settings: {
              examDate: parsed.settings?.examDate || "2027-02-06",
              targetScore: parsed.settings?.targetScore || null,
              targetRank: parsed.settings?.targetRank || null
            }
          };

          saveData();
          showToast("Data restored successfully!", "success");
          renderCurrentTab();
        } catch (err) {
          showToast("Error importing JSON file. Please verify structure.", "warning");
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    function openResetConfirmationModal() {
      openModal(`
        <div class="text-center">
          <div class="w-14 h-14 rounded-full bg-red-500/10 border border-red-500/30 text-red-500 flex items-center justify-center text-2xl mx-auto mb-4">
            ⚠️
          </div>
          <h3 class="text-base font-bold text-[var(--foreground)]">Reset All Data?</h3>
          <p class="text-xs text-[var(--muted-foreground)] mt-2 mb-6 leading-relaxed">
            This will permanently delete all your habits, subjects, and test logs. This cannot be undone.
          </p>
          <div class="flex gap-3">
            <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-[var(--border)] bg-[var(--content)] text-xs font-semibold hover:bg-[var(--border)]">
              Cancel
            </button>
            <button onclick="executeResetAllData()" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-xs font-bold hover:bg-red-700 shadow-md">
              Reset Everything
            </button>
          </div>
        </div>
      `);
    }

    function executeResetAllData() {
      appState = {
        habits: [],
        habitLogs: {},
        subjects: [],
        mockTests: [],
        settings: {
          examDate: "2027-02-06",
          targetScore: null,
          targetRank: null
        }
      };
      expandedSubjects.clear();
      saveData();
      closeModal();
      showToast("All data permanently wiped", "warning");
      renderCurrentTab();
    }

    /* ==========================================================================
       VIEW ROUTER & NAVIGATION
       ========================================================================== */

    function switchTab(tabId) {
      if (currentTab === tabId) return;
      currentTab = tabId;
      renderCurrentTab();
      renderBottomNav();
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (!container) return;

      if (currentTab === 'home') {
        container.innerHTML = renderHomeTab();
      } else if (currentTab === 'syllabus') {
        container.innerHTML = renderSyllabusTab();
      } else if (currentTab === 'focus') {
        container.innerHTML = renderFocusTab();
      } else if (currentTab === 'settings') {
        container.innerHTML = renderSettingsTab();
      }
    }

    function renderBottomNav() {
      const navEl = document.getElementById('bottom-nav');
      if (!navEl) return;

      navEl.innerHTML = NAV_TABS.map(tab => {
        const isActive = currentTab === tab.id;
        return `
          <button onclick="switchTab('${tab.id}')" class="flex-1 flex flex-col items-center justify-center py-1 transition-colors ${isActive ? 'text-[var(--primary)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">
            ${ICONS[tab.icon]}
            <span class="text-[10px] font-bold mt-1 tracking-tight">${tab.label}</span>
            <div class="w-1.5 h-1.5 rounded-full mt-0.5 transition-all ${isActive ? 'bg-[var(--primary)]' : 'bg-transparent'}"></div>
          </button>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* ==========================================================================
       APP INITIALIZATION
       ========================================================================== */

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderBottomNav();
      renderCurrentTab();
    });
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {
        navigator.serviceWorker.register('sw.js');
      });
    });
  }
</script>
</body>
</html>
